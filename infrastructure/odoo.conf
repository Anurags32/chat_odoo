[options]
; Essential configurations for Odoo 18 WebRTC and WebSocket Bus
admin_passwd = admin_master_password
db_host = False
db_port = False
db_user = odoo
db_password = False

; Workers MUST be > 0 so that gevent/websocket server runs on port 8072
workers = 4

; Gevent WebSocket port (default is 8072)
gevent_port = 8072

; HTTP port (default is 8069)
http_port = 8069

; Enable proxy mode so X-Forwarded-* headers from Nginx are trusted
proxy_mode = True

; Addons paths (include custom addons containing webrtc_call)
addons_path = /opt/odoo/odoo/addons,/opt/odoo/custom_addons

; Log settings
logfile = /var/log/odoo/odoo-server.log
log_level = info
