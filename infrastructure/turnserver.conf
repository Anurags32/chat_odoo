# Coturn TURN/STUN Server Configuration for Odoo 18 WebRTC
# Listening ports
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Relay IP (Public IP of your TURN server)
# external-ip=YOUR_PUBLIC_SERVER_IP

# Realm matches the realm configured in Odoo ir.config_parameter 'webrtc_call.turn_realm'
realm=turn.yourdomain.com

# Authentication mechanism: Time-limited HMAC-SHA1 credentials
use-auth-secret
static-auth-secret=YOUR_SHARED_HMAC_SECRET_KEY

# TLS Certificates (Mount from Let's Encrypt or your CA)
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# Relay Port Range for UDP Media traffic (Must open these UDP ports on your firewall)
min-port=49152
max-port=65535

# Fingerprint in STUN/TURN messages
fingerprint

# Bandwidth and quota limits
total-quota=100
bps-capacity=0
stale-nonce=600

# Security: Deny loopback and private IPv4 relaying
no-loopback-peers
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Logging
log-file=stdout
simple-log
verbose
