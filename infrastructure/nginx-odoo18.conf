# Nginx Reverse Proxy for Odoo 18 with WebSocket Bus Support
# Upstream for Odoo HTTP (workers)
upstream odoo_backend {
    server 127.0.0.1:8069;
}

# Upstream for Odoo 18 WebSocket Bus (gevent/websocket)
upstream odoo_websocket {
    server 127.0.0.1:8072;
}

# HTTP to HTTPS redirection
server {
    listen 80;
    server_name odoo.yourdomain.com;
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name odoo.yourdomain.com;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/odoo.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/odoo.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Logging
    access_log /var/log/nginx/odoo_access.log;
    error_log /var/log/nginx/odoo_error.log;

    # Max body size for file/attachment uploads
    client_max_body_size 100M;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # 1. Real-time WebSocket Bus endpoint (/websocket)
    # Routes to Odoo Gevent / Websocket server on port 8072
    location /websocket {
        proxy_pass http://odoo_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400; # Keep websocket open indefinitely
    }

    # 2. General Odoo Web and API traffic (port 8069)
    location / {
        proxy_pass http://odoo_backend;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Static files cache bypass / caching
    location ~* /web/static/ {
        proxy_pass http://odoo_backend;
        proxy_cache_valid 200 60m;
        proxy_buffering on;
        expires 864000;
    }

    # Gzip compression
    gzip_types text/css text/less text/plain text/xml application/xml application/json application/javascript;
    gzip on;
}
